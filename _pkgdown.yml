home:
  title: "DesiredGainR -- Deciding What to Select For"
  description: >
    Multi-trait selection index tools organised around the breeding objective
    rather than around the index. Computing an index is arithmetic; deciding
    what it should select for is the difficult part, and the literature
    identifies the specification of economic weights as the principal obstacle
    to routine index use. DesiredGainR translates exactly between economic
    weights and desired gains, tests whether a stated objective is attainable
    at the planned selection intensity, recovers the objective a programme has
    been applying implicitly from its historical selection differentials, and
    reports how far a decision depends on weights that are themselves
    uncertain. It provides the classical index families through one interface
    (Smith-Hazel, base, Pesek-Baker, Yamada, Mulamba-Mock rank-sum, independent
    culling and tandem selection), the iterative desired-gain index of
    Joukhadar et al. (2024), and the quadratic genomic selection index of
    Ceron-Rojas et al. (2026), each reported with the standard evaluation
    criteria. A multi-cycle simulation layer compares desired-gain directions
    over successive breeding cycles, with founders built from the breeder's own
    phased marker data rather than from a simulated genome.
  links:
    - text: Browse source code
      href: https://github.com/FAkohoue/DesiredGainR
    - text: Report a bug
      href: https://github.com/FAkohoue/DesiredGainR/issues

